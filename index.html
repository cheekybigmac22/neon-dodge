<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afterimage: Last Drive</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">DO NOT LET IT CATCH UP</p>
        <h1>AFTERIMAGE</h1>
        <p class="subtitle">LAST DRIVE</p>
      </header>
      <section class="game-shell" aria-label="Afterimage: Last Drive game">
        <div class="hud"><span>DISTANCE <b id="distance">0m</b></span><span>BEST <b id="best">0m</b></span></div>
        <canvas id="game" width="480" height="680" aria-label="Game area"></canvas>
        <div class="overlay" id="overlay">
          <p class="signal">// SIGNAL FOUND //</p>
          <h2 id="message">KEEP DRIVING</h2>
          <p id="submessage">The road remembers every turn you make.</p>
          <button id="start">START ENGINE</button>
          <label class="motion"><input id="reduce-motion" type="checkbox" /> Reduce motion effects</label>
        </div>
      </section>
      <p class="instructions">Steer with <kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd>. On touch screens, drag to steer.</p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
